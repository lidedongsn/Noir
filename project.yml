# Xcode 工程配置，执行 xcodegen generate 生成 Noir.xcodeproj
name: Noir
options:
  bundleIdPrefix: dev.noir
  deploymentTarget:
    macOS: "15.0"
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEAD_CODE_STRIPPING: YES
packages:
  NoirKit:
    path: Packages/NoirKit
targets:
  NoirMac:
    type: application
    platform: macOS
    sources:
      - path: Apps/macOS
      - path: Apps/Shared
    dependencies:
      - package: NoirKit
        product: NoirEngine
    info:
      path: Apps/macOS/Info.plist
      properties:
        CFBundleDisplayName: 墨影
        LSApplicationCategoryType: public.app-category.entertainment
        NSHumanReadableCopyright: "Copyright © 2026 lidedongsn. MIT License."
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: org.matroska.mkv
            UTTypeDescription: Matroska Video
            UTTypeConformsTo: [public.movie]
            UTTypeTagSpecification:
              public.filename-extension: [mkv]
              public.mime-type: [video/x-matroska]
        CFBundleDocumentTypes:
          - CFBundleTypeName: Video
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [org.matroska.mkv, public.mpeg-4, com.apple.quicktime-movie]
    entitlements:
      path: Apps/macOS/Noir.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-only: true
        # 保存文件夹授权，用于自动加载同名外挂字幕
        com.apple.security.files.bookmarks.app-scope: true
        com.apple.security.network.client: true
    settings:
      base:
        PRODUCT_NAME: Noir
        PRODUCT_BUNDLE_IDENTIFIER: dev.noir.mac
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  NoirPhone:
    type: application
    platform: iOS
    sources:
      - path: Apps/iOS
      - path: Apps/Shared
      # 「关于」页面展示的墨影许可证
      - path: LICENSE
        buildPhase: resources
    dependencies:
      - package: NoirKit
        product: NoirEngine
    info:
      path: Apps/iOS/Info.plist
      properties:
        CFBundleDisplayName: 墨影
        CFBundleDevelopmentRegion: zh-Hans
        CFBundleLocalizations: [zh-Hans]
        LSApplicationCategoryType: public.app-category.entertainment
        NSHumanReadableCopyright: "Copyright © 2026 lidedongsn. MIT License."
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # 在「文件」App 中显示为「我的 iPhone › 墨影」，并支持就地打开其他位置的文件
        # 后台继续播放声音与画中画
        UIBackgroundModes: [audio]
        # WebDAV：局域网 NAS、OpenList 多为 http；首次访问局域网时系统请求本地网络权限
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: 墨影需要访问局域网中的 WebDAV 服务器（如 NAS），以播放其中的影片。
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: org.matroska.mkv
            UTTypeDescription: Matroska Video
            UTTypeConformsTo: [public.movie]
            UTTypeTagSpecification:
              public.filename-extension: [mkv]
              public.mime-type: [video/x-matroska]
        CFBundleDocumentTypes:
          - CFBundleTypeName: Video
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [org.matroska.mkv, public.mpeg-4, com.apple.quicktime-movie]
    # 开发团队写在不入库的 Signing.local.xcconfig 中（DEVELOPMENT_TEAM = 团队 ID）
    configFiles:
      Debug: Apps/iOS/Signing.xcconfig
      Release: Apps/iOS/Signing.xcconfig
    settings:
      base:
        PRODUCT_NAME: Noir
        PRODUCT_BUNDLE_IDENTIFIER: dev.noir.ios
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
